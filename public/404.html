<!doctype html>
<html lang="en">

  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // GitHub Pages 404 fallback for SPA routing.
      // Load the app index while preserving the current path.
      const base = '/DSA_SystemDesign';
      const indexPath = base + '/index.html';
      fetch(indexPath)
        .then((response) => response.text())
        .then((html) => {
          document.open();
          document.write(html);
          document.close();
          history.replaceState({}, '', location.pathname + location.search + location.hash);
        })
        .catch(() => {
          document.body.innerHTML = '<h1>Page not found</h1><p>Please return to <a href="' + base + '/">home</a>.</p>';
        });
    </script>
  </head>

  <body>
    <p>Redirecting…</p>
  </body>

</html>
